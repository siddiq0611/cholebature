name: chole_bature
description: A personal expense tracker app.
publish_to: 'none'
version: 3.4.20

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Local Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Charts
  fl_chart: ^0.66.2

  # UI
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  gap: ^3.0.1

  # Utils
  intl: ^0.18.1
  uuid: ^4.2.2
  cupertino_icons: ^1.0.2

  # Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Import
  file_picker: ^8.0.0

  # Export
  csv: ^6.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.3

  # Crypto (PIN / password hashing)
  crypto: ^3.0.3
  url_launcher: ^6.3.2
  flutter_timezone: ^5.0.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  
url_launcher: ^6.2.6